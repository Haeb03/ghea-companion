<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#1f3a2b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>Ghea Companion</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <style>
    * { box-sizing: border-box; }

    :root {
      --bg: #07110b;
      --panel: #121810;
      --panel2: #1c2518;
      --border: #68583a;
      --text: #f1ead8;
      --muted: #aaa087;
      --ally: #496d35;
      --ally-soft: #20351e;
      --enemy: #8a4036;
      --enemy-soft: #3b201c;
      --gold: #c0a15a;
    }

    html, body { margin:0; min-height:100%; background:#07110b; }

    body {
      min-height:100vh;
      color:var(--text);
      font-family:Georgia, "Times New Roman", serif;
      overflow-x:hidden;
      background:
        linear-gradient(90deg, rgba(14,48,22,.74) 0 42%, rgba(9,12,9,.20) 48% 52%, rgba(63,17,14,.64) 58% 100%),
        radial-gradient(circle at 50% 12%, rgba(188,153,75,.14), transparent 27%),
        repeating-linear-gradient(35deg, rgba(255,255,255,.015) 0 2px, transparent 2px 9px),
        #09140c;
    }

    body::before {
      content:"";
      position:fixed; inset:0; z-index:-1; pointer-events:none;
      background:
        radial-gradient(ellipse at 10% 18%, rgba(53,105,48,.27), transparent 27%),
        radial-gradient(ellipse at 90% 18%, rgba(129,43,34,.23), transparent 27%),
        linear-gradient(90deg, transparent 47%, rgba(139,116,65,.11) 49%, rgba(139,116,65,.18) 50%, rgba(139,116,65,.11) 51%, transparent 53%);
    }

    button, input { font-family:inherit; }
    button { touch-action:manipulation; }

    header {
      min-height:56px;
      background:linear-gradient(#141a12ee,#090e0bee);
      border-bottom:1px solid #7a6338;
      display:flex; align-items:center; justify-content:space-between;
      padding:6px 14px;
      box-shadow:0 4px 18px #0009;
    }

    .brand { display:flex; align-items:baseline; gap:11px; }
    .brand h1 {
      margin:0; font-size:25px; letter-spacing:5px; color:#e4cd8c;
      text-shadow:0 2px 2px #000, 0 0 12px #b28c3d55;
    }
    .brand span { color:#999077; font-size:11px; text-transform:uppercase; letter-spacing:1.2px; }

    .reset-button {
      border:1px solid #8b6b3b;
      background:linear-gradient(#3a2c1d,#1a140e);
      color:#ead8a8;
      border-radius:5px; padding:8px 12px;
      font-weight:bold; font-size:12px;
      box-shadow:inset 0 0 0 1px #0008,0 2px 7px #0008;
    }

    main { width:100%; max-width:1100px; margin:auto; padding:9px; }

    .battlefield {
      display:grid;
      grid-template-columns:1fr 58px 1fr;
      gap:8px; align-items:stretch;
    }

    .team {
      border:1px solid #655536;
      border-radius:6px; padding:8px;
      background:linear-gradient(180deg,rgba(13,20,14,.72),rgba(7,11,8,.84));
      box-shadow:inset 0 0 24px #0008,0 4px 14px #0007;
    }
    .allies { border-color:#4e6d3a; }
    .enemies { border-color:#773a31; }

    .team-header {
      height:32px; display:flex; align-items:center; justify-content:center;
      font-size:14px; font-weight:bold; letter-spacing:2px; text-shadow:0 2px 2px #000;
    }
    .allies .team-header { color:#a9cc79; }
    .enemies .team-header { color:#df7d70; }

    .formation-labels {
      display:grid; grid-template-columns:1fr 1fr; gap:6px;
      margin-bottom:6px; text-align:center; font-size:8px; color:#b9ae8e;
      text-transform:uppercase; letter-spacing:.8px;
    }
    .formation-labels span { padding-bottom:4px; border-bottom:1px solid #76613b66; }

    .formation {
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      grid-template-rows:repeat(3,minmax(82px,1fr));
      gap:6px;
    }

    .slot {
      min-height:82px; padding:5px;
      border:1px dashed #66583c;
      border-radius:6px;
      color:var(--text);
      display:flex; align-items:center; justify-content:center;
      position:relative; overflow:hidden;
      background:
        radial-gradient(circle at center,rgba(151,127,70,.10),transparent 55%),
        linear-gradient(145deg,rgba(255,255,255,.025),rgba(0,0,0,.30));
      box-shadow:inset 0 0 18px #0009;
    }

    .slot::before {
      content:""; position:absolute; inset:7px; border:1px solid #8b744633;
      border-radius:50%; pointer-events:none;
      box-shadow:inset 0 0 0 4px #0002;
    }

    .slot.empty { opacity:.68; }
    .slot.empty::after {
      content:"+"; position:relative; z-index:2;
      font:700 25px Arial,sans-serif; color:#9b8d68;
      text-shadow:0 2px 3px #000;
    }
    .allies .slot.empty { border-color:#49633a; }
    .allies .slot.empty::after { color:#718e57; }
    .enemies .slot.empty { border-color:#6d3932; }
    .enemies .slot.empty::after { color:#a35c51; }

    .slot.occupied { opacity:1; border-style:solid; }
    .allies .slot.occupied {
      background:radial-gradient(circle at 50% 38%,#38592e 0 29%,#1a2b1b 62%,#0b110c 100%);
      border-color:#71964e;
    }
    .enemies .slot.occupied {
      background:radial-gradient(circle at 50% 38%,#6b3229 0 29%,#2d1815 62%,#110c0b 100%);
      border-color:#a34d40;
    }

    .slot.move-target {
      border:2px solid var(--gold); opacity:1;
      background:#302819;
      box-shadow:0 0 14px #c6a86266,inset 0 0 18px #0008;
    }
    .slot.move-target::after { content:"↔"; color:#efd37d; }

    .fighter {
      width:100%; height:100%;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      gap:3px; text-align:center; position:relative; z-index:2;
    }

    .fighter-icon {
      width:31px; height:36px;
      font-size:0; line-height:1; position:relative;
      filter:drop-shadow(0 3px 3px #000);
    }
    .fighter-icon::before {
      content:""; display:block; width:31px; height:36px;
      clip-path:polygon(50% 0,93% 14%,87% 67%,50% 100%,13% 67%,7% 14%);
      background:linear-gradient(135deg,#70954b,#2b4628 62%,#182919);
      box-shadow:inset 0 0 0 2px #d2b66b55;
    }
    .enemies .fighter-icon::before {
      background:linear-gradient(135deg,#b45243,#60291f 62%,#321612);
    }

    .fighter-name {
      width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
      font-size:11px; font-weight:bold; color:#f3ead1; text-shadow:0 2px 2px #000;
    }

    .fighter-stats {
      display:flex; justify-content:center; gap:7px;
      font:700 11px Arial,sans-serif;
      padding:2px 6px; border-radius:10px; background:#080c09a8;
    }

    .fighter-statuses { min-height:13px; font-size:11px; letter-spacing:1px; }

    .versus {
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      gap:4px; color:var(--gold); font-weight:bold;
      text-shadow:0 2px 3px #000;
    }
    .versus .swords {
      width:48px; height:48px; display:grid; place-items:center;
      border:1px solid #816a3d; border-radius:50%;
      background:#17140eaa; box-shadow:inset 0 0 12px #000,0 0 10px #0008;
      font-size:25px;
    }
    .versus .vs { font-size:10px; letter-spacing:2px; }

    .move-message {
      display:none; margin-top:8px; padding:8px;
      border:1px solid #806b3c; border-radius:5px;
      background:#211d12e8; color:#ead18d;
      font-size:12px; text-align:center;
    }
    .move-message.show { display:block; }
    .cancel-move {
      margin-left:8px; border:1px solid #8c743e; border-radius:4px;
      padding:5px 8px; background:#3b321d; color:white; font-weight:bold;
    }

    .tip { margin-top:7px; color:#8d846e; font-size:10px; text-align:center; }

    .overlay {
      position:fixed; inset:0; display:none; align-items:center; justify-content:center;
      padding:14px; background:rgba(0,0,0,.76); backdrop-filter:blur(2px); z-index:100;
    }
    .overlay.show { display:flex; }

    .editor {
      width:min(540px,100%); max-height:95vh; overflow-y:auto;
      background:linear-gradient(#171d14f8,#090d0afc);
      border:1px solid #8a7040; border-radius:6px; padding:14px;
      box-shadow:inset 0 0 0 3px #17130c,inset 0 0 0 4px #5f4d2e,0 12px 40px #000d;
    }

    .editor-top {
      display:flex; gap:8px; align-items:center; margin-bottom:12px;
      padding-bottom:8px; border-bottom:1px solid #6e5a35;
    }

    .editor-icon {
      width:38px; height:43px; font-size:0;
      clip-path:polygon(50% 0,93% 14%,87% 67%,50% 100%,13% 67%,7% 14%);
      background:linear-gradient(135deg,#6e9348,#2a4427 65%,#172719);
      box-shadow:inset 0 0 0 2px #d0b46b55;
    }

    .name-input {
      flex:1; min-width:0; border:none; border-bottom:1px solid #78643b;
      background:transparent; color:#f1e6c8;
      font-size:20px; font-weight:bold; padding:6px;
    }

    .close-button {
      width:38px; height:38px; border:1px solid #7e683d; border-radius:50%;
      background:#211b12; color:#e6cf96; font-size:20px;
    }

    .main-stats { display:grid; grid-template-columns:1fr 1fr; gap:9px; }
    .stat {
      background:linear-gradient(#1d251a,#11150f);
      border:1px solid #594a2f; border-radius:5px; padding:9px 4px; text-align:center;
    }
    .stat-title {
      margin-bottom:7px; color:#d2bd83; font-size:11px; font-weight:bold; letter-spacing:1px;
    }
    .counter { display:flex; align-items:center; justify-content:center; gap:7px; }
    .counter button {
      width:40px; height:40px; border:1px solid #8b7441; border-radius:50%;
      background:linear-gradient(#332a1b,#17130e); color:#f1dfaa;
      font-size:23px; font-weight:bold; box-shadow:inset 0 0 0 2px #0007;
    }
    .counter-value { min-width:34px; font-size:23px; font-weight:bold; }

    .states-title {
      margin:12px 0 6px; color:#cdb678; font-size:10px;
      text-align:center; letter-spacing:2px;
    }
    .states { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
    .state {
      border:1px solid #4f432c; border-radius:5px; padding:7px 2px;
      text-align:center; opacity:.48; background:#11150f;
    }
    .state.active {
      opacity:1; background:#1c2117; border-color:#8b7040;
      box-shadow:inset 0 0 12px #0007;
    }
    .state-name { margin-bottom:5px; font-size:10px; }
    .state-counter { display:flex; align-items:center; justify-content:center; gap:3px; }
    .state-counter button {
      width:29px; height:29px; border:1px solid #806b3c; border-radius:50%;
      background:linear-gradient(#302719,#17130e); color:#f1dfaa;
      font-size:18px; font-weight:bold;
    }
    .state-value { min-width:19px; font-size:16px; font-weight:bold; }

    .editor-actions { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px; }
    .move-button, .delete-button {
      border-radius:4px; padding:11px 8px; font-weight:bold;
      color:#f2dfaa; border:1px solid #806b3c;
      background:linear-gradient(#342b1b,#17130e);
    }
    .delete-button {
      color:#ef9b8f; border-color:#7c3b34;
      background:linear-gradient(#3a201d,#1b100f);
    }

    @media (max-width:700px) and (orientation:portrait) {
      header { min-height:52px; }
      .brand span { display:none; }
      main { padding:6px; }
      .battlefield { grid-template-columns:1fr 34px 1fr; gap:4px; }
      .team { padding:5px; }
      .formation { gap:4px; grid-template-rows:repeat(3,82px); }
      .slot { min-height:82px; padding:3px; }
      .fighter-icon { width:26px; height:30px; }
      .fighter-icon::before { width:26px; height:30px; }
      .fighter-name { font-size:9px; }
      .fighter-stats { flex-direction:column; gap:0; font-size:9px; padding:1px 5px; }
      .formation-labels { font-size:7px; }
      .team-header { font-size:10px; }
      .versus .swords { width:31px; height:31px; font-size:18px; }
      .versus .vs { font-size:8px; }
    }

    @media (orientation:landscape) {
      header { min-height:48px; }
      main { padding:6px 9px; }
      .formation { grid-template-rows:repeat(3,minmax(72px,1fr)); }
      .slot { min-height:72px; }
    }
  </style>
</head>

<body>

<header>
  <div class="brand">
    <h1>GHEA</h1>
    <span>Campo de batalla</span>
  </div>

  <button class="reset-button" id="resetBtn">
    Nueva partida
  </button>
</header>

<main>

  <div class="battlefield">

    <section class="team allies">

      <div class="team-header">
        🛡️ ALIADOS
      </div>

      <div class="formation-labels">
        <span>Retaguardia</span>
        <span>Vanguardia</span>
      </div>

      <div
        class="formation"
        id="allyFormation"
      ></div>

    </section>

    <div class="versus">
      <div class="swords">⚔️</div>
      <div class="vs">VS</div>
    </div>

    <section class="team enemies">

      <div class="team-header">
        🛡️ ENEMIGOS
      </div>

      <div class="formation-labels">
        <span>Vanguardia</span>
        <span>Retaguardia</span>
      </div>

      <div
        class="formation"
        id="enemyFormation"
      ></div>

    </section>

  </div>

  <div
    class="move-message"
    id="moveMessage"
  >
    Elegí una casilla libre para mover la ficha.

    <button
      class="cancel-move"
      id="cancelMoveBtn"
    >
      Cancelar
    </button>
  </div>

  <div class="tip">
    Tocá una casilla vacía para agregar.
    Tocá una ficha para editarla.
  </div>

</main>


<div
  class="overlay"
  id="overlay"
>

  <div class="editor">

    <div class="editor-top">

      <div
        class="editor-icon"
        id="editorIcon"
      >
        🛡️
      </div>

      <input
        class="name-input"
        id="nameInput"
        type="text"
        value="Nombre"
        aria-label="Nombre"
      >

      <button
        class="close-button"
        id="closeBtn"
        aria-label="Cerrar"
      >
        ×
      </button>

    </div>


    <div class="main-stats">

      <div class="stat">

        <div class="stat-title">
          ❤️ VIDA
        </div>

        <div class="counter">

          <button
            data-editor-stat="vida"
            data-editor-amount="-1"
          >
            −
          </button>

          <span
            class="counter-value"
            id="vidaValue"
          >
            10
          </span>

          <button
            data-editor-stat="vida"
            data-editor-amount="1"
          >
            +
          </button>

        </div>

      </div>


      <div class="stat">

        <div class="stat-title">
          🛡️ ESCUDO
        </div>

        <div class="counter">

          <button
            data-editor-stat="escudo"
            data-editor-amount="-1"
          >
            −
          </button>

          <span
            class="counter-value"
            id="escudoValue"
          >
            0
          </span>

          <button
            data-editor-stat="escudo"
            data-editor-amount="1"
          >
            +
          </button>

        </div>

      </div>

    </div>


    <div class="states-title">
      ESTADOS
    </div>

    <div class="states">

      <div
        class="state"
        id="quemaduraBox"
      >

        <div class="state-name">
          🔥 Quemadura
        </div>

        <div class="state-counter">

          <button
            data-editor-stat="quemadura"
            data-editor-amount="-1"
          >
            −
          </button>

          <span
            class="state-value"
            id="quemaduraValue"
          >
            0
          </span>

          <button
            data-editor-stat="quemadura"
            data-editor-amount="1"
          >
            +
          </button>

        </div>

      </div>


      <div
        class="state"
        id="venenoBox"
      >

        <div class="state-name">
          ☠️ Veneno
        </div>

        <div class="state-counter">

          <button
            data-editor-stat="veneno"
            data-editor-amount="-1"
          >
            −
          </button>

          <span
            class="state-value"
            id="venenoValue"
          >
            0
          </span>

          <button
            data-editor-stat="veneno"
            data-editor-amount="1"
          >
            +
          </button>

        </div>

      </div>


      <div
        class="state"
        id="heridaBox"
      >

        <div class="state-name">
          🩸 Herida
        </div>

        <div class="state-counter">

          <button
            data-editor-stat="herida"
            data-editor-amount="-1"
          >
            −
          </button>

          <span
            class="state-value"
            id="heridaValue"
          >
            0
          </span>

          <button
            data-editor-stat="herida"
            data-editor-amount="1"
          >
            +
          </button>

        </div>

      </div>

    </div>


    <div class="editor-actions">

      <button
        class="move-button"
        id="moveBtn"
      >
        ↔️ Mover
      </button>

      <button
        class="delete-button"
        id="deleteBtn"
      >
        🗑️ Eliminar
      </button>

    </div>

  </div>

</div>


<script>

const STORAGE_KEY = "ghea-state-v3";

const allyFormation =
  document.getElementById("allyFormation");

const enemyFormation =
  document.getElementById("enemyFormation");

const overlay =
  document.getElementById("overlay");

const nameInput =
  document.getElementById("nameInput");

const editorIcon =
  document.getElementById("editorIcon");

const moveMessage =
  document.getElementById("moveMessage");


function createFighter(side) {
  return {
    side: side,
    name: side === "ally"
      ? "Nombre"
      : "Enemigo",

    vida: 10,
    escudo: 0,

    quemadura: 0,
    veneno: 0,
    herida: 0
  };
}


function createInitialState() {

  const allies =
    Array(6).fill(null);

  const enemies =
    Array(6).fill(null);

  allies[1] =
    createFighter("ally");

  allies[3] =
    createFighter("ally");

  return {
    allies: allies,
    enemies: enemies
  };
}


let gameState;

try {

  const stored =
    JSON.parse(
      localStorage.getItem(STORAGE_KEY)
    );

  if (
    stored &&
    Array.isArray(stored.allies) &&
    Array.isArray(stored.enemies) &&
    stored.allies.length === 6 &&
    stored.enemies.length === 6
  ) {
    gameState = stored;
  } else {
    gameState =
      createInitialState();
  }

} catch (error) {

  gameState =
    createInitialState();

}


let selectedSide = null;
let selectedSlot = null;

let moveMode = false;
let movingSide = null;
let movingSlot = null;


function save() {

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(gameState)
  );

}


function getTeam(side) {

  return side === "ally"
    ? gameState.allies
    : gameState.enemies;

}


function escapeHtml(text) {

  return String(text)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


function getStatuses(fighter) {

  let statuses = "";

  if (fighter.quemadura > 0) {
    statuses += "🔥";
  }

  if (fighter.veneno > 0) {
    statuses += "☠️";
  }

  if (fighter.herida > 0) {
    statuses += "🩸";
  }

  return statuses;

}


function renderFormation(
  side,
  element
) {

  const team =
    getTeam(side);

  element.innerHTML = "";

  team.forEach(
    function(fighter, index) {

      const slot =
        document.createElement("button");

      slot.className = "slot";

      slot.dataset.side = side;
      slot.dataset.slot = index;


      if (fighter) {

        slot.classList.add(
          "occupied"
        );

        const icon =
          side === "ally"
            ? "🛡️"
            : "👹";

        slot.innerHTML = `
          <div class="fighter">

            <div class="fighter-icon">
              ${icon}
            </div>

            <div class="fighter-name">
              ${escapeHtml(fighter.name)}
            </div>

            <div class="fighter-stats">
              <span>❤️ ${fighter.vida}</span>
              <span>🛡️ ${fighter.escudo}</span>
            </div>

            <div class="fighter-statuses">
              ${getStatuses(fighter)}
            </div>

          </div>
        `;

      } else {

        slot.classList.add(
          "empty"
        );

        if (
          moveMode &&
          side === movingSide
        ) {

          slot.classList.add(
            "move-target"
          );

        }

      }

      element.appendChild(slot);

    }
  );

}


function render() {

  renderFormation(
    "ally",
    allyFormation
  );

  renderFormation(
    "enemy",
    enemyFormation
  );


  if (moveMode) {

    moveMessage.classList.add(
      "show"
    );

  } else {

    moveMessage.classList.remove(
      "show"
    );

  }

}


function openEditor(
  side,
  slot
) {

  const fighter =
    getTeam(side)[slot];

  if (!fighter) {
    return;
  }

  selectedSide = side;
  selectedSlot = slot;

  editorIcon.textContent =
    side === "ally"
      ? "🛡️"
      : "👹";

  nameInput.value =
    fighter.name;

  updateEditor();

  overlay.classList.add(
    "show"
  );

}


function closeEditor() {

  overlay.classList.remove(
    "show"
  );

  selectedSide = null;
  selectedSlot = null;

}


function updateEditor() {

  if (
    selectedSide === null ||
    selectedSlot === null
  ) {
    return;
  }

  const fighter =
    getTeam(selectedSide)[selectedSlot];

  if (!fighter) {
    return;
  }


  document.getElementById(
    "vidaValue"
  ).textContent =
    fighter.vida;


  document.getElementById(
    "escudoValue"
  ).textContent =
    fighter.escudo;


  document.getElementById(
    "quemaduraValue"
  ).textContent =
    fighter.quemadura;


  document.getElementById(
    "venenoValue"
  ).textContent =
    fighter.veneno;


  document.getElementById(
    "heridaValue"
  ).textContent =
    fighter.herida;


  document.getElementById(
    "quemaduraBox"
  ).classList.toggle(
    "active",
    fighter.quemadura > 0
  );


  document.getElementById(
    "venenoBox"
  ).classList.toggle(
    "active",
    fighter.veneno > 0
  );


  document.getElementById(
    "heridaBox"
  ).classList.toggle(
    "active",
    fighter.herida > 0
  );

}


function changeStat(
  stat,
  amount
) {

  if (
    selectedSide === null ||
    selectedSlot === null
  ) {
    return;
  }

  const fighter =
    getTeam(selectedSide)[selectedSlot];

  fighter[stat] =
    Math.max(
      0,
      Number(fighter[stat] || 0)
        + amount
    );

  save();
  updateEditor();
  render();

}


function handleSlotClick(event) {

  const slot =
    event.target.closest(".slot");

  if (!slot) {
    return;
  }

  const side =
    slot.dataset.side;

  const index =
    Number(slot.dataset.slot);

  const team =
    getTeam(side);

  const fighter =
    team[index];


  if (moveMode) {

    if (
      side === movingSide &&
      fighter === null
    ) {

      const movingTeam =
        getTeam(movingSide);

      movingTeam[index] =
        movingTeam[movingSlot];

      movingTeam[movingSlot] =
        null;

      moveMode = false;
      movingSide = null;
      movingSlot = null;

      save();
      render();

    }

    return;
  }


  if (fighter) {

    openEditor(
      side,
      index
    );

    return;
  }


  team[index] =
    createFighter(side);

  save();
  render();

  openEditor(
    side,
    index
  );

}


allyFormation.addEventListener(
  "click",
  handleSlotClick
);


enemyFormation.addEventListener(
  "click",
  handleSlotClick
);


document
  .querySelectorAll(
    "[data-editor-stat]"
  )
  .forEach(
    function(button) {

      button.addEventListener(
        "click",
        function() {

          const stat =
            button.dataset.editorStat;

          const amount =
            Number(
              button.dataset.editorAmount
            );

          changeStat(
            stat,
            amount
          );

        }
      );

    }
  );


nameInput.addEventListener(
  "input",
  function() {

    if (
      selectedSide === null ||
      selectedSlot === null
    ) {
      return;
    }

    const fighter =
      getTeam(selectedSide)[selectedSlot];

    fighter.name =
      nameInput.value;

    save();
    render();

  }
);


document
  .getElementById("closeBtn")
  .addEventListener(
    "click",
    closeEditor
  );


document
  .getElementById("deleteBtn")
  .addEventListener(
    "click",
    function() {

      if (
        selectedSide === null ||
        selectedSlot === null
      ) {
        return;
      }

      const team =
        getTeam(selectedSide);

      team[selectedSlot] =
        null;

      save();
      closeEditor();
      render();

    }
  );


document
  .getElementById("moveBtn")
  .addEventListener(
    "click",
    function() {

      if (
        selectedSide === null ||
        selectedSlot === null
      ) {
        return;
      }

      movingSide =
        selectedSide;

      movingSlot =
        selectedSlot;

      moveMode = true;

      closeEditor();
      render();

    }
  );


document
  .getElementById("cancelMoveBtn")
  .addEventListener(
    "click",
    function() {

      moveMode = false;
      movingSide = null;
      movingSlot = null;

      render();

    }
  );


document
  .getElementById("resetBtn")
  .addEventListener(
    "click",
    function() {

      const confirmed =
        confirm(
          "¿Iniciar una nueva partida?"
        );

      if (!confirmed) {
        return;
      }

      gameState =
        createInitialState();

      moveMode = false;
      movingSide = null;
      movingSlot = null;

      closeEditor();

      save();
      render();

    }
  );


overlay.addEventListener(
  "click",
  function(event) {

    if (event.target === overlay) {
      closeEditor();
    }

  }
);


render();


if ("serviceWorker" in navigator) {

  window.addEventListener(
    "load",
    function() {

      navigator.serviceWorker.register(
        "./sw.js"
      );

    }
  );

}

</script>

</body>
</html>
