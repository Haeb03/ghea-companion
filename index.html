<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1f3a2b"><title>Ghea Companion</title><link rel="manifest" href="./manifest.json"><style>
*{box-sizing:border-box}body{margin:0;background:#0d1711;color:#f3f3f3;font-family:Arial,sans-serif}header{height:54px;padding:0 14px;background:#14251b;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #31503c}h1{font-size:22px;letter-spacing:2px;margin:0}.new{background:#432525;color:#ffdede;border:1px solid #714343;border-radius:9px;padding:8px 12px;font-weight:bold}main{max-width:1100px;margin:auto;padding:10px}.field{display:grid;grid-template-columns:1fr 54px 1fr;gap:8px}.team{background:#121f17;border:1px solid #31503c;border-radius:14px;padding:8px}.title{text-align:center;font-weight:bold;font-size:13px;padding:6px}.labels{display:grid;grid-template-columns:1fr 1fr;text-align:center;color:#9fb0a5;font-size:9px;margin-bottom:5px}.grid{display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(3,76px);gap:6px}.slot{border:1px dashed #405448;border-radius:10px;background:#101c15;color:white;min-width:0}.slot.empty{opacity:.55}.slot.empty:after{content:'+';font-size:24px}.slot.occupied{border-style:solid}.allies .occupied{background:#203d2b;border-color:#4d765a}.enemies .occupied{background:#3b2424;border-color:#754848}.slot.target{border:2px solid #c6a862;background:#302b1b;opacity:1}.slot.target:after{content:'↔'}.fighter{display:flex;height:100%;flex-direction:column;justify-content:center;align-items:center;gap:3px}.name{font-size:12px;font-weight:bold;max-width:100%;overflow:hidden;text-overflow:ellipsis}.stats{font-size:12px;font-weight:bold}.statuses{font-size:11px;min-height:13px}.vs{display:flex;align-items:center;justify-content:center;flex-direction:column;color:#c6a862;font-weight:bold}.moveMsg{display:none;text-align:center;margin-top:8px;padding:8px;background:#302b1b;border:1px solid #756638;border-radius:9px}.moveMsg.show{display:block}.moveMsg button{margin-left:8px}.tip{text-align:center;color:#718178;font-size:10px;margin-top:8px}.overlay{display:none;position:fixed;inset:0;background:#000b;z-index:10;align-items:center;justify-content:center;padding:14px}.overlay.show{display:flex}.editor{width:min(520px,100%);background:#16251b;border:1px solid #49604f;border-radius:16px;padding:14px}.top{display:flex;gap:8px;align-items:center}.top input{flex:1;min-width:0;background:transparent;color:white;border:0;border-bottom:1px solid #5c7563;font-size:20px;font-weight:bold;padding:6px}.close{width:38px;height:38px;background:#304438;color:white;border:0;border-radius:9px;font-size:20px}.mainstats,.states,.actions{display:grid;gap:8px}.mainstats{grid-template-columns:1fr 1fr;margin-top:12px}.states{grid-template-columns:repeat(3,1fr);margin-top:10px}.box{background:#203528;border-radius:10px;padding:8px;text-align:center}.state{opacity:.45;border:1px solid #31463a}.state.active{opacity:1;border-color:#607b68}.counter{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:6px}.counter button{width:36px;height:36px;border:0;border-radius:8px;background:#355843;color:white;font-size:21px}.state .counter button{width:29px;height:29px;font-size:17px}.val{min-width:25px;font-weight:bold;font-size:21px}.state .val{font-size:16px}.actions{grid-template-columns:1fr 1fr;margin-top:12px}.actions button{border:0;border-radius:10px;padding:11px;color:white;font-weight:bold}.move{background:#655a31}.delete{background:#5a2929}@media(max-width:700px) and (orientation:portrait){.field{grid-template-columns:1fr 30px 1fr;gap:3px}.team{padding:4px}.grid{grid-template-rows:repeat(3,82px);gap:3px}.stats{font-size:10px;display:flex;flex-direction:column}.name{font-size:10px}.labels{font-size:7px}}
</style></head><body><header><h1>GHEA</h1><button class="new" id="reset">Nueva partida</button></header><main><div class="field"><section class="team allies"><div class="title">🛡️ ALIADOS</div><div class="labels"><span>Retaguardia</span><span>Vanguardia</span></div><div class="grid" id="allies"></div></section><div class="vs">⚔️<small>VS</small></div><section class="team enemies"><div class="title">ENEMIGOS 👹</div><div class="labels"><span>Vanguardia</span><span>Retaguardia</span></div><div class="grid" id="enemies"></div></section></div><div class="moveMsg" id="moveMsg">Elegí una casilla libre.<button id="cancel">Cancelar</button></div><div class="tip">Tocá una casilla vacía para agregar. Tocá una ficha para editarla.</div></main>
<div class="overlay" id="overlay"><div class="editor"><div class="top"><span id="icon">🛡️</span><input id="name" value="Nombre"><button class="close" id="close">×</button></div><div class="mainstats"><div class="box">❤️ VIDA<div class="counter"><button data-s="vida" data-a="-1">−</button><span class="val" id="vida">10</span><button data-s="vida" data-a="1">+</button></div></div><div class="box">🛡️ ESCUDO<div class="counter"><button data-s="escudo" data-a="-1">−</button><span class="val" id="escudo">0</span><button data-s="escudo" data-a="1">+</button></div></div></div><div class="states"><div class="box state" id="quemaduraBox">🔥 Quemadura<div class="counter"><button data-s="quemadura" data-a="-1">−</button><span class="val" id="quemadura">0</span><button data-s="quemadura" data-a="1">+</button></div></div><div class="box state" id="venenoBox">☠️ Veneno<div class="counter"><button data-s="veneno" data-a="-1">−</button><span class="val" id="veneno">0</span><button data-s="veneno" data-a="1">+</button></div></div><div class="box state" id="heridaBox">🩸 Herida<div class="counter"><button data-s="herida" data-a="-1">−</button><span class="val" id="herida">0</span><button data-s="herida" data-a="1">+</button></div></div></div><div class="actions"><button class="move" id="move">↔️ Mover</button><button class="delete" id="delete">🗑️ Eliminar</button></div></div></div>
<script>
const KEY='ghea-state-v3',A=document.getElementById('allies'),E=document.getElementById('enemies'),O=document.getElementById('overlay'),N=document.getElementById('name'),I=document.getElementById('icon'),M=document.getElementById('moveMsg');
const fighter=side=>({side,name:side==='ally'?'Nombre':'Enemigo',vida:10,escudo:0,quemadura:0,veneno:0,herida:0});
function initial(){let allies=Array(6).fill(null),enemies=Array(6).fill(null);allies[1]=fighter('ally');allies[3]=fighter('ally');return{allies,enemies}}
let g;try{g=JSON.parse(localStorage.getItem(KEY));if(!g||g.allies?.length!==6||g.enemies?.length!==6)g=initial()}catch{g=initial()}let side=null,pos=null,moving=false,fromSide=null,fromPos=null;
const save=()=>localStorage.setItem(KEY,JSON.stringify(g)),team=s=>s==='ally'?g.allies:g.enemies,esc=t=>String(t).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
function status(f){return(f.quemadura?'🔥':'')+(f.veneno?'☠️':'')+(f.herida?'🩸':'')}
function draw(s,el){el.innerHTML='';team(s).forEach((f,i)=>{let b=document.createElement('button');b.className='slot '+(f?'occupied':'empty');b.dataset.side=s;b.dataset.pos=i;if(!f&&moving&&s===fromSide)b.classList.add('target');if(f)b.innerHTML=`<div class="fighter"><div>${s==='ally'?'🛡️':'👹'}</div><div class="name">${esc(f.name)}</div><div class="stats">❤️ ${f.vida} &nbsp; 🛡️ ${f.escudo}</div><div class="statuses">${status(f)}</div></div>`;el.appendChild(b)})}
function render(){draw('ally',A);draw('enemy',E);M.classList.toggle('show',moving)}
function edit(s,p){let f=team(s)[p];if(!f)return;side=s;pos=p;I.textContent=s==='ally'?'🛡️':'👹';N.value=f.name;update();O.classList.add('show')}
function close(){O.classList.remove('show');side=null;pos=null}
function update(){if(side===null)return;let f=team(side)[pos];['vida','escudo','quemadura','veneno','herida'].forEach(k=>document.getElementById(k).textContent=f[k]);['quemadura','veneno','herida'].forEach(k=>document.getElementById(k+'Box').classList.toggle('active',f[k]>0))}
function clickSlot(ev){let b=ev.target.closest('.slot');if(!b)return;let s=b.dataset.side,p=+b.dataset.pos,t=team(s);if(moving){if(s===fromSide&&!t[p]){t[p]=t[fromPos];t[fromPos]=null;moving=false;fromSide=fromPos=null;save();render()}return}if(t[p])return edit(s,p);t[p]=fighter(s);save();render();edit(s,p)}
A.addEventListener('click',clickSlot);E.addEventListener('click',clickSlot);document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{if(side===null)return;let f=team(side)[pos],k=b.dataset.s;f[k]=Math.max(0,+f[k]+ +b.dataset.a);save();update();render()});N.oninput=()=>{if(side===null)return;team(side)[pos].name=N.value;save();render()};document.getElementById('close').onclick=close;document.getElementById('delete').onclick=()=>{if(side===null)return;team(side)[pos]=null;save();close();render()};document.getElementById('move').onclick=()=>{if(side===null)return;fromSide=side;fromPos=pos;moving=true;close();render()};document.getElementById('cancel').onclick=()=>{moving=false;fromSide=fromPos=null;render()};document.getElementById('reset').onclick=()=>{if(confirm('¿Iniciar una nueva partida?')){g=initial();moving=false;close();save();render()}};O.onclick=e=>{if(e.target===O)close()};render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));
</script></body></html>
